# Local development configuration: plain HTTP on localhost, state in ./dev-data.
# NEVER use this layout for a real deployment (see zenv-ca.example.toml).
#
#   export ZENV_CA_CONFIG=config/zenv-ca.dev.toml
#   export ZENV_CA_INTERMEDIATE_PASSPHRASE_FILE=dev-data.intermediate.pass
#   printf 'dev-intermediate-pass' > $ZENV_CA_INTERMEDIATE_PASSPHRASE_FILE
#   printf 'dev-root-passphrase!!' > dev-data.root.pass
#   cargo run --bin zenv-ca -- init --root-passphrase-file dev-data.root.pass
#   cargo run --bin zenv-cad          # → http://127.0.0.1:8080

[server]
listen = "127.0.0.1:8080"
public_url = "http://127.0.0.1:8080"

[server.tls]
enabled = false

[paths]
data_dir = "dev-data"

[ca.root]
validity_days = 3650
key_algorithm = "ecdsa-p384"

[ca.root.subject]
common_name = "Zenv DEV Root CA"
organization = "Zenv"
organizational_unit = "Local Development"

[ca.intermediate]
validity_days = 365
key_algorithm = "ecdsa-p256"

[ca.intermediate.subject]
common_name = "Zenv DEV Issuing CA"
organization = "Zenv"
organizational_unit = "Local Development"

[policy]
allowed_dns_suffixes = ["dmz.zenv.internal"]
allowed_ip_networks = ["127.0.0.0/8"]
allow_wildcards = true
